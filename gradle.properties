# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx1G
org.gradle.daemon=false
org.gradle.debug=false

# Environment Properties
# You can find the latest versions here: https://projects.neoforged.net/neoforged/neoforge
# The Minecraft version must agree with the Neo version to get a valid artifact
minecraft_version=26.1.2
# The Minecraft version range can use any release version of Minecraft as bounds.
# Snapshots, pre-releases, and release candidates are not guaranteed to sort properly
# as they do not follow standard versioning conventions.
minecraft_version_range=[26.1.2,26.2)
# The Neo version must agree with the Minecraft version to get a valid artifact
neo_version=26.1.2.122
# The Neo version range can use any version of Neo as bounds
neo_version_range=[26.1.2.81,)
# The loader version range can only use the major version of FML as bounds
loader_version_range=[4,)

# Required - resolved from mavenLocal(), published by our local 26.1.2 ports
minecolonies_version=1.1.1397-26.1.2
structurize_version=0.0.1-26.1.2
multipiston_version=0.0.1-26.1.2
blockui_version=0.0.1-26.1.2
domumornamentum_version=1.0.0-local

# Native EMI integration, built locally to mavenLocal() from the port26.1 branch of
# https://github.com/MehanikTMYT/emi. MineColonies' own gradle.properties pins commit cdf2a46f, but
# this project also depends on com.ldtteam:domum-ornamentum (a real Maven coordinate, unlike
# MineColonies' own raw-file dependency on it), which transitively declares a *newer* commit
# (4524a4bf, "port: update EMI for NeoForge 26.1.2"). Gradle's default conflict resolution silently
# wins with the newer one on the runtime classpath regardless of what is requested here, so this is
# pinned to match that actual resolved version -- keeping compileOnly's :api jar and the runtimeOnly
# jar from the same commit, rather than leaving a pin that doesn't take effect at runtime anyway.
# Verified working (clean compile, clean build, client reaches the title screen with no EMI-related
# exceptions) against this version.
emiVersion=1.1.24-semi151a6c88+26.1.2
runWithEmi=true

## Mod Properties

# The unique mod identifier for the mod. Must be lowercase in English locale. Must fit the regex [a-z][a-z0-9_]{1,63}
# Must match the String constant located in the main mod class annotated with @Mod.
mod_id=mctradepost
# The human-readable display name for the mod.
mod_name=Trade Post for MineColonies
# The license of the mod. Review your options at https://choosealicense.com/. All Rights Reserved is the default.
mod_license=GPLv3   
# The mod version. See https://semver.org/
mod_version=1.07.003-26.1.2
# The group ID for the mod. It is only important when publishing as an artifact to a Maven repository.
# This should match the base package used for the mod sources.
# See https://maven.apache.org/guides/mini/guide-naming-conventions.html
mod_group_id=com.deathfrog.mctradepost
# The authors of the mod. This is a simple text string that is used for display purposes in the mod list.
mod_authors=Ayar, Alysar
# The description of the mod. This is a simple multiline text string that is used for display purposes in the mod list.
mod_description=Extends MineColonies.\nEconomics research that opens up a marketplace, a resort, a recycling center and more!
